# Docker Compose environment for Sports Store.
#
# Clone the component repositories as siblings of this repository, then:
#   cp .env.example .env
#   docker compose up --build -d
#
# Only the gateway publishes a port to the host; every other service is
# reachable exclusively over the sports-store-net bridge network, by its
# compose service name (matches the upstream names baked into the
# gateway's nginx.conf).

services:
  # ---------------------------------------------------------------------
  # MongoDB
  # ---------------------------------------------------------------------
  mongo:
    image: mongo:7.0.39
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./seed/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - sports-store-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------
  # Redis (Standalone Cache fallback for local development)
  # ---------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    networks:
      - sports-store-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  # ---------------------------------------------------------------------
  # Backend microservices
  # ---------------------------------------------------------------------
  auth:
    build: ../sports-store-auth-service
    environment:
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sports-store-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  catalog:
    build: ../sports-store-catalog-service
    environment:
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - sports-store-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  cart:
    build: ../sports-store-cart-service
    environment:
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      CATALOG_URL: http://catalog:8002
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mongo:
        condition: service_healthy
      catalog:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sports-store-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8003/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  order:
    build: ../sports-store-order-service
    environment:
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      CART_URL: http://cart:8003
      CATALOG_URL: http://catalog:8002
      PAYMENT_URL: http://payment:8005
      SHIPPING_FLAT_RATE: "5.00"
      FREE_SHIPPING_THRESHOLD: "100"
    depends_on:
      mongo:
        condition: service_healthy
      cart:
        condition: service_healthy
      catalog:
        condition: service_healthy
      payment:
        condition: service_healthy
    networks:
      - sports-store-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8004/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  payment:
    build: ../sports-store-payment-service
    environment:
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      PAYMENT_FAILURE_SUFFIX: ${PAYMENT_FAILURE_SUFFIX}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - sports-store-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8005/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------
  frontend:
    build: ../sports-store-frontend
    networks:
      - sports-store-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------
  # NGINX gateway
  # ---------------------------------------------------------------------
  gateway:
    build: ../sports-store-gateway
    ports:
      - "80:80"
    depends_on:
      auth:
        condition: service_healthy
      catalog:
        condition: service_healthy
      cart:
        condition: service_healthy
      order:
        condition: service_healthy
      payment:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - sports-store-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  sports-store-net:
    driver: bridge

volumes:
  mongo_data:
