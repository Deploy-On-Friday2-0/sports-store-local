name: PR Quality and Security

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch name validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Use feature/, bugfix/, or hotfix/ followed by a lowercase kebab-case slug."
            exit 1
          fi

  compose:
    name: Docker Compose configuration validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Validate rendered Compose configuration
        run: docker compose --env-file .env.example config --quiet

  secrets:
    name: Gitleaks history and file scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0

      - name: Install verified Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" | sha256sum --check
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
          mkdir --parents "${RUNNER_TEMP}/bin"
          install "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/bin/gitleaks"
          printf '%s\n' "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Scan pull request branch history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Scan current repository files
        run: gitleaks dir --redact --verbose .
